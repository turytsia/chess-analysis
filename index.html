<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Analyze your chess games with Stockfish and train your openings."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Chess Analysis</title>
    <script src="./coi-serviceworker.js"></script>
    <script>
      (function () {
        var theme = 'system';
        try {
          var stored = localStorage.getItem('chess-analysis:settings');
          theme = (stored && JSON.parse(stored).state.theme) || theme;
        } catch (error) {}
        var isDark =
          theme === 'dark' ||
          (theme === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', isDark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
